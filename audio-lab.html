<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NON-MIND audio lab</title>
<style>
  :root { color-scheme: dark; --bg: #0d0e12; --fg: #d9dbe4; --mute: #7d8194; --acc: #9fd4c8; --line: #262935; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 16px; letter-spacing: .2em; font-weight: 600; margin: 0 0 12px; }
  section { border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  h2 { font-size: 12px; color: var(--mute); text-transform: uppercase; letter-spacing: .12em; margin: 0 0 8px; font-weight: 500; }
  .row { display: grid; grid-template-columns: 110px 1fr 48px; gap: 8px; align-items: center; margin: 4px 0; }
  input[type=range] { width: 100%; }
  button { background: #1a1c24; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font: inherit; cursor: pointer; margin: 2px; }
  button:hover { border-color: var(--acc); }
  button.primary { background: var(--acc); color: #0d0e12; border-color: var(--acc); font-weight: 600; }
  canvas { width: 100%; height: 160px; display: block; background: #08090c; border-radius: 4px; }
  #status { color: var(--mute); margin-left: 8px; }
  label.radio { margin-right: 12px; }
  .grid { display: flex; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1>NON-MIND · AUDIO LAB</h1>
  <section><button id="start" class="primary">Start</button><button id="stop">Stop</button><button id="reset">reset (non-mind)</button><label><input type="checkbox" id="mute"> mute</label><span id="status">idle</span></section>
  <section><h2>Mood</h2><div id="sliders"></div><div id="stances"></div></section>
  <section><h2>Aspects</h2><div id="aspects"></div></section>
  <section><h2>SFX</h2><div class="row"><span>sfx aspect</span><select id="sfxAspect"></select><span></span></div><div class="grid" id="sfx"></div></section>
  <section><h2>Spectrum</h2><canvas id="spec" width="940" height="160"></canvas><div id="levels" style="color:var(--mute);margin-top:6px"></div></section>
</main>
<script type="module" src="/src/audio/lab.js"></script>
</body>
</html>
